<meta charset="utf-8">

<title>MicText — on-device dictation</title>
<link rel="manifest" href="manifest.webmanifest">

<meta name="theme-color" content="#1A1D24">
<style>
  body { font-family: system-ui, sans-serif; max-width: 34rem; margin: 0 auto;
         padding: 1.5rem 1rem; text-align: center; background: #F7F5F0; color: #1A1D24; }
  h1 { margin: .25rem 0 .25rem; }
  p  { margin: 0 0 1rem; color: #555; }
  mictext-mic { display: inline-flex; margin: 1rem auto 1.25rem; --mictext-mic-size: 5.5rem; }
  mictext-mic::part(ring) { display: none; } /* the grille IS the loading animation */
  /* busy: grille bars wrap around the pill-shaped capsule; animation removal
     on completion snaps them home */
  /* overlapping cascade: each row's lap starts halfway through the previous
     one's (0.3s steps, 0.6s laps in a 1.2s cycle), so a wave ripples down
     the capsule perpetually — row 1's next lap follows row 4 at the same
     spacing. The lap is eased (fast middle, soft landing into the hold);
     a hold at -84px is pixel-identical to rest, so every hand-off and the
     loop restart are seamless. */
  mictext-mic[busy] .logo .row { animation: grille-turn 1.2s infinite; }
  mictext-mic[busy] .logo .row:nth-child(2) { animation-delay: .3s; }
  mictext-mic[busy] .logo .row:nth-child(3) { animation-delay: .6s; }
  mictext-mic[busy] .logo .row:nth-child(4) { animation-delay: .9s; }
  @keyframes grille-turn {
    0%   { transform: translateX(0); animation-timing-function: cubic-bezier(.5, 0, .25, 1); }
    50%  { transform: translateX(-84px); }
    100% { transform: translateX(-84px); }
  }
  @media (prefers-reduced-motion: reduce) {
    mictext-mic[busy] .logo .row { animation: grille-dim 1.6s ease-in-out infinite; }
  }
  @keyframes grille-dim { 50% { opacity: .35; } }
  textarea { width: 100%; box-sizing: border-box; font-size: 1rem; padding: .6rem;
             border: 1px solid #ccc; border-radius: 8px; min-height: 7rem; }
  #copy { font-size: 1rem; padding: .55rem 1.5rem; margin-top: .6rem; border-radius: 8px;
          border: none; background: #1A1D24; color: #F2EFE7; }
  #copy:active { opacity: .8; }
  #err { color: #FF4D3D; min-height: 1.2em; margin-top: .5rem; font-size: .9rem; }
  @media (prefers-color-scheme: dark) {
    body { background: #16181D; color: #F2EFE7; }
    p { color: #9aa1ad; }
    textarea { background: #1F232B; color: #F2EFE7; border-color: #3E4756; }
    #copy { background: #F2EFE7; color: #1A1D24; }
  }
</style>

services:
  mictext:
    build: .
    container_name: mictext
    restart: unless-stopped
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-small.en}
      - API_KEYS=${API_KEYS}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://app.example.com}
    volumes:
      - whisper-models:/models
    networks: [traefik-public]
    labels:
      - traefik.enable=true
      - traefik.http.routers.mictext.rule=Host(`stt.example.com`)
      - traefik.http.routers.mictext.entrypoints=websecure
      - traefik.http.routers.mictext.tls.certresolver=letsencrypt
      - traefik.http.services.mictext.loadbalancer.server.port=8000
volumes:
  whisper-models:
networks:
  traefik-public:
    external: true
